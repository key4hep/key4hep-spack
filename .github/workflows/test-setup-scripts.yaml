name: Test Setup Scripts

on:
  push:
    branches:
      - main
    paths:
      - scripts/cvmfs/setup-nightlies.sh
      - scripts/cvmfs/setup-releases.sh
      - .github/workflows/test-setup-scripts.yaml
  pull_request:
    paths:
      - scripts/cvmfs/setup-nightlies.sh
      - scripts/cvmfs/setup-releases.sh
      - .github/workflows/test-setup-scripts.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-nightlies:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: alma9
            image: ghcr.io/key4hep/key4hep-images/alma9-cvmfs
          - os: ubuntu24
            image: ghcr.io/key4hep/key4hep-images/ubuntu24-cvmfs
          - os: ubuntu26
            image: ghcr.io/key4hep/key4hep-images/ubuntu26-cvmfs
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up cvmfs
        run: /mount.sh

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7

      - name: Source nightlies setup script (opt)
        run: source scripts/cvmfs/setup-nightlies.sh

      - name: Source nightlies setup script (dbg)
        run: source scripts/cvmfs/setup-nightlies.sh -d

      - name: Source LCG weekday setup scripts (opt)
        if: matrix.os != 'ubuntu24'
        run: |
          for day in Mon Tue Wed Thu Fri Sat; do
            (
              source scripts/cvmfs/setup-nightlies.sh -r "$day"
              [[ "$lcg_setup_script" == "/cvmfs/sft-nightlies.cern.ch/lcg/views/devkey-head/$day/"* ]]
            )
          done

      - name: Source LCG weekday setup scripts (dbg)
        if: matrix.os != 'ubuntu24'
        run: |
          for day in Mon Tue Wed Thu Fri Sat; do
            (
              source scripts/cvmfs/setup-nightlies.sh -r "$day" -d
              [[ "$lcg_setup_script" == "/cvmfs/sft-nightlies.cern.ch/lcg/views/devkey-head/$day/"* ]]
            )
          done

      - name: Reject Sunday LCG nightlies
        if: matrix.os != 'ubuntu24'
        run: |
          if output=$(source scripts/cvmfs/setup-nightlies.sh -r Sun 2>&1); then
            echo "Expected the Sunday LCG setup to fail"
            exit 1
          else
            status=$?
          fi
          printf '%s\n' "$output"
          [[ "$status" -eq 1 ]]
          [[ "$output" == *"LCG nightlies are not built on Sunday"* ]]

  test-releases:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: alma9
            image: ghcr.io/key4hep/key4hep-images/alma9-cvmfs
          - os: ubuntu24
            image: ghcr.io/key4hep/key4hep-images/ubuntu24-cvmfs
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up cvmfs
        run: /mount.sh

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7

      - name: Source releases setup script (opt)
        run: source scripts/cvmfs/setup-releases.sh

      - name: Source releases setup script (dbg)
        run: source scripts/cvmfs/setup-releases.sh -d
